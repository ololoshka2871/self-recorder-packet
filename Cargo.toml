[package]
authors = ["ololoshka2871"]
name = "self-recorder-packet"
version = "0.4.0"
edition = "2018"

[dependencies]
heatshrink-rust = { version = "0.7.0", rev = "0af9332", git = "https://github.com/ololoshka2871/heatshrink.rs.git" }
crc32fast = { version = "1.3.0", optional = true }
tempdir = { version = "0.3.7", optional = true }
rayon = { version = "1.5", optional = true}

[dev-dependencies]
rand = "0.8"

[features]
unpacker = ["crc32fast", "tempdir", "dep:rayon"]
default = ["unpacker"]
